name: Publish Ardalis.SmartEnum packages to NuGet

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for NuGet trusted publishing (OIDC)

jobs:
  publish:
    name: Publish Ardalis.SmartEnum packages to nuget.org
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.x
            11.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      # Every package under src/ shares the version in Directory.Build.props,
      # so one release publishes all of them. Packages whose version already
      # exists on nuget.org are skipped.
      - name: Pack
        run: |
          for proj in src/*/*.csproj; do
            dotnet pack "$proj" --configuration Release --no-build --output ./artifacts
          done

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ardalis

      - name: Push to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
